# Vérification à chaque push et pull request : types, lint, tests, secrets.
name: Vérification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Adresse factice : next.config.ts l'exige pour la CSP, aucun appel n'est fait pendant la vérification.
      NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint . --max-warnings 0
      - run: npx vitest run
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
