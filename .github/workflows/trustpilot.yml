# Avis Trustpilot des SaaS (data/saas.json), une fois par mois : 1 recherche Tavily par SaaS (~140 sur
# les 1 000 gratuites du mois). Les avis sont triés et regroupés par la collecte de la nuit suivante.
# Secrets du repo : NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SECRET_KEY, TAVILY_API_KEY.
name: Avis Trustpilot (chaque mois)

on:
  schedule:
    - cron: "0 1 2 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trustpilot
  cancel-in-progress: false

jobs:
  trustpilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collecter
        run: npx tsx scripts/collecte/collecter-trustpilot.mts
