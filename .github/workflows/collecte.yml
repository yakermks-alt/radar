# Chaque nuit (4 h 30 à Paris l'été) : collecte des avis, tri par l'IA, embeddings, regroupement.
# Secrets du repo : NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SECRET_KEY, GEMINI_API_KEY.
name: Collecte et analyse (chaque nuit)

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  nuit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Modèle d'embeddings en cache
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: modele-embeddings-paraphrase-multilingual-minilm-l12-v2
      - name: Collecter les avis
        run: npx tsx scripts/collecte/collecter-avis.mts
      - name: Trier les avis négatifs (IA)
        run: npx tsx scripts/analyse/trier-avis.mts
      - name: Calculer les embeddings
        run: npx tsx scripts/analyse/calculer-embeddings.mts
      - name: Regrouper et classer
        run: npx tsx scripts/analyse/regrouper.mts
