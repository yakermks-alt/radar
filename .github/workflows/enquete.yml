# Mène une enquête de l'agent, lancée depuis le site (API GitHub, jeton limité à ce dépôt).
# Secrets du repo : NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SECRET_KEY, GEMINI_API_KEY, INSEE_API_KEY, TAVILY_API_KEY.
name: Enquête de l'agent

on:
  workflow_dispatch:
    inputs:
      id:
        description: Numéro de l'enquête
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: enquete-${{ inputs.id }}
  cancel-in-progress: false

jobs:
  enquete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      # Jamais interpolé directement dans une commande : passé par variable, puis vérifié.
      ENQUETE_ID: ${{ inputs.id }}
    steps:
      - name: Vérifier le numéro
        run: '[[ "$ENQUETE_ID" =~ ^[0-9]{1,9}$ ]] || { echo "Numéro invalide"; exit 1; }'
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Modèle d'embeddings en cache
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: modele-embeddings-paraphrase-multilingual-minilm-l12-v2
      - name: Enquêter
        run: npx tsx scripts/agent/enqueter.mts --reprendre "$ENQUETE_ID"
