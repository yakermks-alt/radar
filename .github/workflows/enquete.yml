# Mène une enquête de l'agent, lancée depuis le site (API GitHub, jeton limité à ce dépôt).
# Chaque heure, sans numéro : reprend les enquêtes interrompues ou oubliées (phase 5).
# Secrets du repo : NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SECRET_KEY, GEMINI_API_KEY, INSEE_API_KEY, TAVILY_API_KEY.
name: Enquête de l'agent

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      id:
        description: Numéro de l'enquête (vide = reprendre les enquêtes interrompues)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: enquete-${{ inputs.id || 'reprises' }}
  cancel-in-progress: false

jobs:
  enquete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      # Jamais interpolé directement dans une commande : passé par variable, puis vérifié.
      ENQUETE_ID: ${{ inputs.id }}
    steps:
      - name: Vérifier le numéro
        run: '[[ -z "$ENQUETE_ID" || "$ENQUETE_ID" =~ ^[0-9]{1,9}$ ]] || { echo "Numéro invalide"; exit 1; }'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Modèle d'embeddings en cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: modele-embeddings-paraphrase-multilingual-minilm-l12-v2
      - name: Enquêter
        run: |
          if [[ -n "$ENQUETE_ID" ]]; then npx tsx scripts/agent/enqueter.mts --reprendre "$ENQUETE_ID"
          else npx tsx scripts/agent/enqueter.mts --file; fi
